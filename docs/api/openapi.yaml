openapi: 3.1.0
info:
  title: LMS API — Hệ thống thư viện điện tử
  version: 1.0.0
  description: 'REST API JSON của hệ thống thư viện điện tử (nhóm 6, INT3505E).


    **Client:** `frontend/main-web` (bạn đọc, cổng 5173) và `frontend/admin-web` (quản trị, cổng 5175). Kiến trúc tách rời
    cho phép thêm mobile app/đối tác dùng lại API.


    **Xác thực:** JWT tự ký (HS256). Access token 15 phút, refresh token 7 ngày; gửi qua `Authorization: Bearer <accessToken>`.


    **Phân quyền:** `/api/v1/public/**` và `/api/v1/reader/**` công khai; `/api/v1/admin/**` yêu cầu role ADMIN; các nhóm
    còn lại yêu cầu đăng nhập.


    **Lỗi:** mọi lỗi trả cùng một cấu trúc `ApiError` với `code` ổn định.


    **Phân trang:** tham số `page` (0-based), `size`, `sort=field,asc|desc`; response kiểu Spring `Page` (`content`, `totalElements`,
    `totalPages`, `number`, `size`).'
servers:
- url: http://localhost:8080
  description: Môi trường dev local (Spring Boot)
paths:
  /api/v1/reviews/{reviewId}:
    put:
      tags:
      - Khác
      operationId: updateReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Sửa đánh giá của tôi
      security:
      - bearerAuth: []
    delete:
      tags:
      - Khác
      operationId: deleteReview
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Không có nội dung trả về
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Xóa đánh giá của tôi
      security:
      - bearerAuth: []
  /api/v1/admin/categories/{id}:
    put:
      tags:
      - Quản trị — Danh mục
      operationId: rename
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Đổi tên thể loại
      security:
      - bearerAuth: []
    delete:
      tags:
      - Quản trị — Danh mục
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Không có nội dung trả về
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Xóa thể loại rỗng
      security:
      - bearerAuth: []
  /api/v1/admin/books/{bookId}:
    put:
      tags:
      - Quản trị — Sách
      operationId: updateBook
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
