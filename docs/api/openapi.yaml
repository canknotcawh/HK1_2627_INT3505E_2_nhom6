    get:
      tags:
      - Đọc PDF bằng canary token
      operationId: stream
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: Range
        in: header
        required: false
        schema:
          type: string
        description: Range HTTP để tải từng phần, ví dụ `bytes=0-1023`.
        example: bytes=0-
      responses:
        '200':
          description: Nội dung PDF (200 toàn bộ, 206 khi có Range).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: inline; filename*=UTF-8''…
            Cache-Control:
              schema:
                type: string
              description: private, no-store, max-age=0
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow, noarchive
            Accept-Ranges:
              schema:
                type: string
              description: bytes
        '206':
          description: Một phần nội dung theo header Range (Content-Range đi kèm).
        '410':
          description: Token hết hạn/đã thu hồi hoặc file không còn (`CANARY_TOKEN_EXPIRED`, `CANARY_TOKEN_REVOKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Stream PDF theo canary token (Range, no-store)
      security: []
