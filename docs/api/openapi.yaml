        '400':
          $ref: '#/components/responses/BadRequest'
      summary: Đăng nhập bằng Google ID token
      parameters: []
      security: []
  /api/v1/public/auth/email-verification/resend:
    post:
      tags:
      - Xác thực công khai
      operationId: resend
      requestBody:
        content:
          application/json:
