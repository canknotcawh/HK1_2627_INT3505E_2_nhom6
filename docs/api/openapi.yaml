  /api/v1/admin/books/{bookId}/files/{fileId}/content:
    get:
      tags:
      - Quản trị — Tệp PDF
      operationId: content
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        required: false
        schema:
          type: string
        description: Range HTTP để tải từng phần, ví dụ `bytes=0-1023`.
        example: bytes=0-
      responses:
        '200':
          description: Nội dung PDF (200 toàn bộ, 206 khi có Range).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: inline; filename*=UTF-8''…
            Cache-Control:
              schema:
                type: string
              description: private, no-store, max-age=0
            Referrer-Policy:
              schema:
                type: string
              description: no-referrer
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow, noarchive
            Accept-Ranges:
              schema:
                type: string
              description: bytes
        '206':
          description: Một phần nội dung theo header Range (Content-Range đi kèm).
        '410':
          description: Token hết hạn/đã thu hồi hoặc file không còn (`CANARY_TOKEN_EXPIRED`, `CANARY_TOKEN_REVOKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Tải nội dung PDF để kiểm tra
      security:
      - bearerAuth: []
