          type: array
          items:
            type: string
    ApiError:
      type: object
      description: Cấu trúc lỗi thống nhất của toàn bộ API.
      required:
      - status
      - code
      - message
      - timestamp
      properties:
        status:
          type: integer
          format: int32
          example: 403
        code:
          type: string
          example: LOAN_REQUIRED
        message:
          type: string
          example: an active loan is required to read this book
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'Chỉ có khi lỗi validation 400: tên field → thông điệp.'
          example:
            email: must be a well-formed email address
    PageMeta:
      type: object
      description: Các field phân trang có trong mọi response kiểu Page của Spring.
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
          description: Trang hiện tại, 0-based
        size:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT nhận từ /api/v1/public/auth/login hoặc /google.
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ (`VALIDATION_FAILED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Chưa đăng nhập hoặc access token không hợp lệ/hết hạn (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Không đủ quyền hoặc tài khoản bị khóa (`FORBIDDEN`, `ACCOUNT_DISABLED`, `LOAN_REQUIRED`…).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Không tìm thấy tài nguyên (`*_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
tags:
- name: Xác thực công khai
  description: Đăng ký, đăng nhập mật khẩu/Google, refresh/logout, quên mật khẩu, xác thực email bằng OTP.
- name: Tra cứu sách
  description: Tìm kiếm/lọc sách công khai, chi tiết sách, danh sách thể loại. Không cần đăng nhập.
- name: Đánh giá sách (công khai)
  description: Đọc đánh giá đã công bố và thống kê điểm của một cuốn sách.
- name: Hồ sơ cá nhân
  description: Xem/cập nhật hồ sơ và đổi mật khẩu của người dùng đang đăng nhập.
- name: Hồ sơ & mượn trả (bạn đọc)
  description: Danh sách lượt mượn của tôi, mượn sách, gửi trả, gia hạn.
- name: Quyền đọc & cấp link canary
  description: Kiểm tra quyền đọc và xin link PDF có canary token (TTL ngắn, thu hồi được).
- name: Đọc PDF bằng canary token
  description: Stream PDF theo token; không dùng header Authorization. Hỗ trợ Range, no-store, no-referrer.
- name: Đánh giá sách (bạn đọc)
  description: Tạo/sửa/xóa đánh giá; chỉ người đã mượn và đã trả sách mới đủ điều kiện.
- name: Đánh giá của tôi
  description: Danh sách đánh giá do chính người dùng viết.
- name: Quản trị — Sách
  description: CRUD sách, số bản, ngừng/kích hoạt lưu hành.
- name: Quản trị — Tệp PDF
  description: Upload/list/archive PDF preview & full; tải nội dung để kiểm tra. Không lộ storage key.
- name: Quản trị — Danh mục
  description: Thêm/đổi tên/gộp/xóa thể loại.
- name: Quản trị — Mượn/trả
  description: Duyệt/từ chối trả, đánh dấu quá hạn, mất sách, thu hồi sách.
- name: Quản trị — Mượn của người dùng
  description: Xem lịch sử mượn của một người dùng cụ thể.
- name: Quản trị — Người dùng
  description: Tìm kiếm, xem chi tiết, khóa/mở khóa, cấp/hạ quyền admin.
- name: Quản trị — Thống kê
  description: Số liệu tổng quan cho bảng điều khiển.
- name: Quản trị — Canary
  description: Danh sách/lọc token, chi tiết, lịch sử đọc, tra cứu token/URL/prefix, thu hồi.
- name: Quản trị — Kiểm duyệt đánh giá
  description: Xem toàn bộ đánh giá, ẩn/khôi phục/xóa.
