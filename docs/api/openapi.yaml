        required: true
      responses:
        '204':
          description: Không có nội dung trả về
        '400':
          $ref: '#/components/responses/BadRequest'
      summary: Thu hồi refresh token (đăng xuất)
      parameters: []
      security: []
  /api/v1/public/auth/login:
