      security:
      - bearerAuth: []
  /api/v1/users/me/password:
    post:
      tags:
      - Hồ sơ cá nhân
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      summary: Đổi mật khẩu (thu hồi các phiên khác)
      parameters: []
      security:
      - bearerAuth: []
  /api/v1/users/me/loans:
    get:
      tags:
      - Hồ sơ & mượn trả (bạn đọc)
      operationId: listMyLoans
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - RETURNED
          - OVERDUE
          - LOST
          - PENDING_RETURN
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        description: Số trang, bắt đầu từ 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
        description: Số phần tử mỗi trang.
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Sắp xếp dạng `field,asc|desc`, ví dụ `borrowedAt,desc`.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLoanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      summary: Lịch sử mượn của tôi (lọc theo trạng thái)
      security:
      - bearerAuth: []
    post:
      tags:
      - Hồ sơ & mượn trả (bạn đọc)
      operationId: borrow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowRequest'
        required: true
      responses:
        '201':
          description: Tạo mới thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      summary: Mượn một cuốn sách
      parameters: []
      security:
      - bearerAuth: []
  /api/v1/users/me/loans/{loanId}/return:
    post:
      tags:
