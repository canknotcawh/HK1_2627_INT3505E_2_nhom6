services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không mount database/books.sql vào /docker-entrypoint-initdb.d: file đó tạo bảng
    # public.book/... trước khi Flyway có flyway_schema_history, khiến lần chạy đầu trên
    # volume mới chết với "Found non-empty schema(s) public".
    # ./run-dev.sh tự nạp catalog sau khi app migrate xong (khi bảng book rỗng).
    # Nếu không chạy app qua script:
    #   PGPASSWORD=lms psql -h 127.0.0.1 -p 5433 -U lms -d lms -f database/books.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI: http://localhost:8025
      - "1025:1025"   # SMTP

volumes:
  pgdata:
