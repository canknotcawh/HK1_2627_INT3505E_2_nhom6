services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../../database/books.sql:/docker-entrypoint-initdb.d/10-books.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI: http://localhost:8025
      - "1025:1025"   # SMTP

  ai-service:
    build:
      context: ../../../ai-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-lms_internal_jwt_super_secret_key_32_bytes_min!}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lms
      DB_USER: lms_readonly
      DB_PASSWORD: ${DB_READONLY_PASSWORD:-lms_readonly_dev_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3.8-flash
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
