server:
  port: 8080

spring:
  application:
    name: lms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lms}?options=-c%20TimeZone%3DAsia/Ho_Chi_Minh
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:3000}
  bootstrap-admin-emails: ${APP_BOOTSTRAP_ADMIN_EMAILS:}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-32-bytes-minimum-secret}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
