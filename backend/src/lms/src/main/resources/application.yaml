server:
  port: 8080

spring:
  application:
    name: lms
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:lms}?options=-c%20TimeZone%3DAsia/Ho_Chi_Minh
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:lms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  profiles:
    default: dev

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:3000}
  bootstrap-admin-emails: ${APP_BOOTSTRAP_ADMIN_EMAILS:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@lms.local}
  frontend:
    main-url: ${MAIN_WEB_URL:http://localhost:5173}
  email-verification:
    challenge-ttl: ${EMAIL_VERIFICATION_TTL:10m}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
